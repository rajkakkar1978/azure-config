parameters:
  - name: tenant
    type: string
    default: kpmgsandboxcomau
    values:
      - kpmgcomau
      - kpmgsandboxcomau
  - name: businessUnit
    type: string
  - name: projectName
    type: string
  - name: environment
    type: string

steps:
  - checkout: self
    fetchDepth: 1

  - task: PowerShell@2
    displayName: Retrieve Subscription Details
    name: EnvironmentVar
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $subscriptionPath = "$(System.DefaultWorkingDirectory)/projects/${{ parameters.tenant }}/${{ parameters.businessUnit }}/${{ parameters.projectName }}/${{ parameters.environment }}/subscription.json"
        $subscriptionDetails = Get-Content -LiteralPath $subscriptionPath -Raw | ConvertFrom-Json -ErrorAction Stop

        Write-Host -Object "Subscription Name: '$($subscriptionDetails.subscriptionName)'"
        Write-Host -Object "Subscription Id: '$($subscriptionDetails.subscriptionID)'"
        Write-Host "##vso[task.setvariable variable=subscriptionName;isOutput=true]$($subscriptionDetails.subscriptionName)"
        Write-Host "##vso[task.setvariable variable=subscriptionID;isOutput=true]$($subscriptionDetails.subscriptionID)"
