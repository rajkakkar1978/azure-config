parameters:
  - name: tenant
    type: string
    default: kpmgsandboxcomau
    values:
      - kpmgcomau
      - kpmgsandboxcomau
  - name: subscription
    type: string

steps:
  - checkout: self
    fetchDepth: 1

  - task: PowerShell@2
    displayName: Retrieve Subscription Details
    name: EnvironmentVar
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $subscriptionPath = "$(System.DefaultWorkingDirectory)/projects/${{ parameters.tenant }}/${{ parameters.subscription }}/subscription.json"
        $subscriptionDetails = Get-Content -LiteralPath $subscriptionPath -Raw | ConvertFrom-Json -ErrorAction Stop

        Write-Host -Object "TenantName: '${{ parameters.tenant }}' Tenant ID: '$($subscriptionDetails.tenantID)'"
        Write-Host -Object "SubscriptionName: '${{ parameters.subscription }}' Subscription ID: '$($subscriptionDetails.subscriptionID)'"
        Write-Host -Object "##vso[task.setvariable variable=tenantID]$($subscriptionDetails.tenantID)"
        Write-Host -Object "##vso[task.setvariable variable=subscriptionID]$($subscriptionDetails.subscriptionID)"
